<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2430; --sunk:#0f141b;
    --fg:#e6edf3; --mut:#8b949e; --line:#30363d; --acc:#58a6ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    --b0:#58a6ff; --b1:#3fb950; --b2:#d29922; --b3:#a371f7; --b4:#f85149; --b5:#2dd4bf;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
       font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}

  header{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;
         border-bottom:1px solid var(--line);background:var(--card)}
  header .t{font-weight:650;letter-spacing:-.01em}
  header .d{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
  header .sp{flex:1}
  button{background:var(--card2);border:1px solid var(--line);color:var(--fg);
         font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
         padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#484f58}
  button.p{background:var(--acc);color:#07121f;border-color:var(--acc);font-weight:700}
  button:disabled{opacity:.4;cursor:default}
  .saved{font-family:var(--mono);font-size:11.5px;color:var(--b1)}

  main{display:flex;height:calc(100% - 52px)}
  #stage{flex:1;position:relative;overflow:hidden;cursor:grab;background:
    radial-gradient(circle at 1px 1px, #1b2029 1px, transparent 0) 0 0/26px 26px}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;inset:0;transform-origin:0 0}

  aside{width:0;border-left:1px solid var(--line);background:var(--card);
        display:flex;flex-direction:column;transition:width .14s ease;overflow:hidden}
  aside.open{width:400px}
  aside .hd{padding:12px 16px;border-bottom:1px solid var(--line);
            font-family:var(--mono);font-size:11px;letter-spacing:.09em;
            text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center}
  aside .hd .sp{flex:1}
  textarea{flex:1;width:100%;background:var(--sunk);border:0;color:var(--fg);
           font-family:var(--mono);font-size:12.5px;line-height:1.65;padding:14px 16px;
           resize:none;outline:none;tab-size:2}
  .hist{overflow-y:auto;padding:8px 0}
  .hist div{padding:8px 16px;border-bottom:1px solid #21262d;font-size:12.5px;color:var(--mut)}
  .hist div b{color:var(--fg);font-weight:600;font-family:var(--mono);font-size:11.5px}

  .node{cursor:pointer}
  .node .hit{fill:transparent}
  .node .box{fill:transparent;stroke:transparent;rx:8;transition:fill .12s,stroke .12s}
  .node:hover .box{fill:#ffffff08;stroke:#30363d}
  .node.sel .box{fill:#58a6ff14;stroke:var(--acc);stroke-width:1.6}
  .node text{font-family:var(--sans);pointer-events:none;user-select:none;
             dominant-baseline:central}
  .node.ghost{opacity:.35}
  /* Focus: the chosen branch keeps full contrast, the rest of the map stays
     visible but stops competing. Transitioned so it reads as attention
     moving rather than the map redrawing. */
  #svg.focus .node{opacity:.44;transition:opacity .16s}
  #svg.focus .edge{opacity:.2;transition:opacity .16s}
  #svg.focus .knob{opacity:.3}
  #svg.focus .node.lit{opacity:1}
  #svg.focus .edge.lit{opacity:.95}
  #svg.focus .knob.lit{opacity:1}
  .node.drop .box{fill:#3fb95026;stroke:var(--b1);stroke-width:2}

  /* The context menu teaches the keyboard while you use the mouse, which is
     how anyone actually learns shortcuts. */
  #menu{position:absolute;display:none;z-index:40;min-width:234px;padding:6px;
        background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 16px 44px #000a}
  #menu.on{display:block}
  #menu .mi{display:flex;align-items:center;justify-content:space-between;gap:18px;
            padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--fg)}
  #menu .mi:hover{background:#ffffff0e}
  #menu .mi.dim{color:var(--mut);cursor:default}
  #menu .mi.dim:hover{background:none}
  #menu .k{font-family:var(--mono);font-size:10px;color:var(--mut);white-space:nowrap;
           background:#ffffff0d;border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  #menu .sep{height:1px;background:var(--line);margin:5px 4px}
  /* Anchored to the node rather than docked, so the map stays the subject and
     the panel is plainly about one thing. */
  #panel{position:absolute;display:none;z-index:45;width:390px;
         background:var(--card);border:1px solid var(--line);border-radius:12px;
         box-shadow:0 22px 60px #000b;overflow:hidden}
  #panel.on{display:block}
  #panel .ph{display:flex;align-items:center;gap:10px;padding:11px 13px;
             border-bottom:1px solid var(--line)}
  #panel .pt{font-weight:650;font-size:13px}
  #panel .pid{font-family:var(--mono);font-size:10px;color:var(--mut);
              background:#ffffff0d;border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  #panel .px{margin-left:auto;background:none;border:none;color:var(--mut);
             font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
  #panel .px:hover{color:var(--fg)}
  #panel .pb{padding:13px}
  #panel .trail{font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:7px;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #panel .ttl{font-size:15px;font-weight:600;margin-bottom:11px;line-height:1.3}
  #panel textarea,#panel input,#panel select{width:100%;background:var(--bg);color:var(--fg);
      border:1px solid var(--line);border-radius:8px;padding:9px 10px;
      font-family:var(--sans);font-size:12.5px;line-height:1.55;outline:none;resize:vertical}
  #panel textarea::placeholder{color:#6e7681;line-height:1.5}
  #panel textarea:focus,#panel input:focus,#panel select:focus{border-color:var(--acc)}
  #panel .row{display:flex;gap:9px;margin-top:10px}
  #panel label{flex:1;font-size:10px;color:var(--mut);text-transform:uppercase;
               letter-spacing:.05em;display:block}
  #panel label input,#panel label select{margin-top:4px}
  #panel .stg{display:block;margin-top:10px}
  #panel .pf{display:flex;align-items:center;gap:8px;margin-top:13px}
  #panel .note{font-size:10.5px;color:var(--mut);margin-left:auto}

  #hint.lite{opacity:.5;transition:opacity .15s}
  #hint.lite:hover{opacity:1}
  #keys{position:absolute;inset:0;display:none;place-items:center;z-index:60;
        background:#010409d9;backdrop-filter:blur(3px)}
  #keys.on{display:grid}
  #keys .kb{max-width:620px;line-height:2.5;font-size:13px;color:var(--mut);
            background:var(--card);border:1px solid var(--line);border-radius:12px;
            padding:22px 26px;box-shadow:0 22px 60px #000b}
  #keys .kb b{color:var(--fg);font-family:var(--mono);font-size:11.5px;
              background:#ffffff0d;border:1px solid var(--line);border-radius:5px;padding:2px 6px}

  /* Same chrome as the work order, because they are the same kind of thing:
     a small amount of detail about one node. */
  #ask{position:absolute;display:none;z-index:46;width:400px;
       background:var(--card);border:1px solid var(--line);border-radius:12px;
       box-shadow:0 22px 60px #000b;overflow:hidden}
  #ask.on{display:block}
  #ask .ph{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
  #ask .pt{font-weight:650;font-size:13px}
  #ask .st{font-family:var(--mono);font-size:10px;color:var(--mut);
           border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  #ask .px{margin-left:auto;background:none;border:none;color:var(--mut);
           font-size:18px;line-height:1;cursor:pointer}
  #ask .px:hover{color:var(--fg)}
  #ask .pb{padding:13px}
  #ask .trail{font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:7px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ask .ttl{font-size:15px;font-weight:600;margin-bottom:11px;line-height:1.3}
  #ask textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);
                border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:12.5px;
                line-height:1.55;outline:none;resize:vertical}
  #ask textarea:focus{border-color:var(--acc)}
  #ask .pf{display:flex;align-items:center;gap:8px;margin-top:11px}
  #ask .note{font-size:10.5px;color:var(--mut);margin-left:auto}
  #ask .out{margin-top:12px;max-height:280px;overflow:auto;font-size:12.5px;line-height:1.65;
            color:#c9d1d9;white-space:pre-wrap;display:none}
  #ask .out.on{display:block;border-top:1px solid var(--line);padding-top:11px}
  /* A question in flight should read as working, not as decoration. */
  @keyframes thinking{0%,100%{opacity:.35}50%{opacity:1}}
  .asking{animation:thinking 1.1s ease-in-out infinite}

  #dropline{position:absolute;pointer-events:none;display:none;font-family:var(--mono);
            font-size:11px;color:#0d1117;background:var(--b1);padding:4px 9px;border-radius:6px;z-index:8}
  #dropline.on{display:block}

  .knob{cursor:pointer}
  .knob circle{transition:fill .12s}
  .knob:hover circle{fill:#30363d}
  .knob text{font-family:var(--mono);font-size:9.5px;fill:#8b949e;pointer-events:none;
             text-anchor:middle;dominant-baseline:central}

  /* Outline is the same document read as a list. For typing a branch quickly,
     or reading one back, a list beats a map. */
  #outline{flex:1;display:none;overflow:auto;padding:30px 0 60px}
  #outline.on{display:block}
  #stage.off{display:none}
  .ol{max-width:860px;margin:0 auto;padding:0 28px}
  .ol .r{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer}
  .ol .r:hover{background:#ffffff07}
  .ol .r.sel{background:#58a6ff14;box-shadow:inset 0 0 0 1.4px var(--acc)}
  .ol .r.hit .lab{background:var(--b2);color:#0d1117;border-radius:4px;padding:0 5px}
  .ol .chev{width:16px;text-align:center;color:var(--mut);font-size:11px;flex:none;
            font-family:var(--mono);user-select:none}
  .ol .chev.has{cursor:pointer}
  .ol .chev.has:hover{color:var(--fg)}
  .ol .dot{width:5px;height:5px;border-radius:50%;flex:none}
  .ol .lab{outline:none;min-width:12px;line-height:1.5}
  .ol .lab:focus{box-shadow:inset 0 -1.6px 0 var(--acc)}
  .ol .n{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-left:6px}
  .ol .d0 .lab{font-size:24px;font-weight:680}
  .ol .d1 .lab{font-size:17px;font-weight:620}
  .ol .d2 .lab{font-size:15px;font-weight:500}
  .ol .lab{font-size:14px;color:#c9d1d9}
  .ol .guide{border-left:1px solid #21262d;margin-left:8px}

  /* A task is a node that someone has to do. It stays inside the mermaid text
     as a trailing tag, so the document remains one file and still opens in
     any mermaid renderer. */
  .node.task .box{fill:#ffffff06;stroke:#30363d}
  .node.done text{opacity:.5}
  .chk{cursor:pointer}
  .chk circle{transition:fill .12s}
  .chk:hover circle{fill:#30363d}
  .ol .r .slots{display:flex;gap:4px;align-items:center;flex:none;cursor:pointer;
                background:#ffffff07;border-radius:9px;padding:3px 7px}
  .ol .r .slots .s{width:7px;height:7px;border-radius:50%;display:block}
  .ol .r .slots .s.done{background:#3fb950}
  .ol .r .slots .s.running{background:#d29922}
  .ol .r .slots .s.stopped{background:#f85149}
  .ol .r .slots .s.empty{box-shadow:inset 0 0 0 1.2px #30363d}
  .ol .r.done .lab{opacity:.5;text-decoration:line-through}
  .ol .meta{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-left:8px}
  .ol .meta.due{color:var(--b2)}
  .ol .meta.over{color:var(--b4)}

  #find{background:var(--sunk);border:1px solid var(--line);border-radius:7px;color:var(--fg);
        font-family:var(--sans);font-size:13px;padding:6px 11px;width:190px;outline:none}
  #find:focus{border-color:var(--acc)}
  #findN{font-family:var(--mono);font-size:11px;color:var(--mut);min-width:54px}
  .node.hit text{fill:#0d1117 !important}
  .node.hit .box{fill:var(--b2);stroke:var(--b2)}
  .node.cur .box{fill:#f0b429;stroke:#fff;stroke-width:2}

  #edit{position:absolute;display:none;z-index:7;background:#0d1117;color:var(--fg);
        border:1.6px solid var(--acc);border-radius:8px;outline:none;
        font-family:var(--sans);padding:4px 10px;text-align:center;
        box-shadow:0 6px 24px #0009}
  #edit.on{display:block}


  #hint{position:absolute;left:18px;bottom:16px;font-family:var(--mono);font-size:11.5px;
        color:var(--mut);background:#0d1117cc;padding:7px 11px;border-radius:7px;
        border:1px solid var(--line);pointer-events:none}
  #zoom{position:absolute;right:18px;bottom:16px;display:flex;gap:6px}
</style>
</head>
<body>

<header>
  <span class="t">Mindmap</span>
  <span class="d" id="meta">loading</span>
  <input id="find" placeholder="find…" spellcheck="false">
  <span id="findN"></span>
  <span class="sp"></span>
  <span class="saved" id="saved"></span>
  <button id="bsrc">source</button>
  <button id="bhist">history</button>
  <button id="bview">outline</button>
  <button id="bexport">export</button>
  <button id="bfit">fit</button>
  <button class="p" id="bsave">save</button>
</header>

<main>
  <div id="stage">
    <div id="world"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <input id="edit" spellcheck="false" autocomplete="off">
    <div id="menu"></div>
    <div id="ask">
      <div class="ph"><span class="pt">Ask</span><span class="st"></span>
        <button class="px" title="close (esc)">&times;</button></div>
      <div class="pb">
        <div class="trail"></div>
        <div class="ttl"></div>
        <textarea class="q" rows="3" spellcheck="false"
          placeholder="Ask about this node. The path above it is sent too, so you can say &quot;this&quot;."></textarea>
        <div class="pf"><button class="p" data-k="send">ask</button>
          <span class="note"></span></div>
        <div class="out"></div>
      </div>
    </div>
    <div id="panel">
      <div class="ph"><span class="pt">Work order</span><span class="pid"></span>
        <button class="px" title="close (esc)">&times;</button></div>
      <div class="pb">
        <div class="trail"></div>
        <div class="ttl"></div>
        <textarea class="desc" rows="7" spellcheck="false"
          placeholder="What has to be done, and how will you know it worked?

This becomes the brief the factory reads, so write it for someone who has
not been in the conversation."></textarea>
        <div class="row">
          <label>Repo<input class="repo" spellcheck="false" placeholder="saas/payment-worker"></label>
          <label>Ticket<input class="key" spellcheck="false" placeholder="PAY-59"></label>
        </div>
        <label class="stg">Stage<select class="stage"></select></label>
        <div class="pf">
          <button class="p" data-p="save">save</button>
          <button data-p="emit">emit brief</button>
          <span class="note"></span>
        </div>
      </div>
    </div>
    <div id="dropline"></div>
    <div id="hint" class="lite"><b>tab</b> child &middot; <b>enter</b> sibling &middot; <b>right-click</b> actions &middot; <b>?</b> all shortcuts</div>
    <div id="keys"><div class="kb">click a node &middot; <b>tab</b> child &middot; <b>enter</b> sibling &middot; <b>dbl-click</b> rename &middot; <b>del</b> remove &middot; <b>&#8984;z</b> undo &middot; <b>&#8984;f</b> find &middot; <b>space</b> stage &middot; <b>t</b> open order &middot; <b>w</b> work order &middot; <b>a</b> ask &middot; <b>&#8984;&#8593;&#8595;</b> reorder &middot; <b>&#8997;1/2/9</b> depth &middot; <b>arrows</b> navigate</div></div>
    <div id="zoom">
      <button data-z="out">&minus;</button><button data-z="in">+</button><button data-z="one">100%</button>
    </div>
  </div>

  <div id="outline"><div class="ol" id="olBody"></div></div>

  <aside id="side">
    <div class="hd"><span id="sideTitle">source</span><span class="sp"></span>
      <button id="bclose">close</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="hist" id="hist" style="display:none"></div>
  </aside>
</main>

<script>
// ---------------------------------------------------------------- model
// The document is mermaid mindmap text. Indentation is the tree, which is
// also what makes it hand-editable: the thing you type is the thing we draw.

const BRANCH = ["--b0","--b1","--b2","--b3","--b4","--b5"];

// The stations of the delivery line, in order. A work order is always at
// exactly one of them, which is what makes a map answer "where is this".
const PAD_X = 78, PAD_Y = 30;

// Short, stable, and generated on the client so a work order has an identity
// before any server has heard of it.
function mintId() {
  return Math.random().toString(16).slice(2, 10);
}

const STAGES = ["open", "specified", "doing", "checking", "reviewing", "ready", "done"];
const STAGE_COLOR = {
  open: "#8b949e", briefed: "#58a6ff", building: "#d29922", proving: "#d29922",
  attacking: "#a371f7", gating: "#2dd4bf", ready: "#3fb950", shipped: "#3fb950",
};
const STAGE_SHORT = {
  open: "open", briefed: "brief", building: "build", proving: "prove",
  attacking: "attack", gating: "gate", ready: "ready", shipped: "shipped",
};

// The five stations, in the order the line runs them. Four are agents; the
// last is the human, and it is the only one that can publish.
const SLOTS = [
  { k: "S", name: "Specified" },
  { k: "D", name: "Doing" },
  { k: "C", name: "Checking" },
  { k: "R", name: "Reviewing" },
  { k: "\u2713", name: "Done" },
];

// For now the slots are read from the stage, so the interface can be judged
// before the evidence that will eventually drive it exists. When receipts
// land, only this function changes: everything downstream already speaks in
// done / running / stopped / empty.
//
//   done     a receipt exists for that station
//   running  the station is working now
//   stopped  it refused, and said why
//   empty    it has not run
function slotsOf(t) {
  if (!t) return null;

  // Derived from the two lists rather than from fixed indexes, so changing
  // either one cannot leave a stage pointing at a slot that is not there.
  // The first stage is "nothing has started", so stage i runs slot i - 1.
  const last = STAGES.length - 1;
  const clamp = i => Math.max(-1, Math.min(SLOTS.length - 1, i));

  if (t.st === "stopped") {
    // A stop belongs to the slot that was running when it happened.
    const i = clamp(t.at | 0);
    return SLOTS.map((_, k) => k < i ? "done" : k === i ? "stopped" : "empty");
  }

  const at = STAGES.indexOf(t.st);
  if (at === last) return SLOTS.map(() => "done");

  const running = clamp(at - 1);
  return SLOTS.map((_, k) => k < running ? "done" : k === running ? "running" : "empty");
}

const SLOT_FILL = { done: "#3fb950", running: "#d29922", stopped: "#f85149", empty: "#30363d" };
let doc = "", tree = null, sel = null, z = 1, ox = 0, oy = 0, dirty = false;

// Undo is in memory and holds the document text, not a diff. A mindmap is
// small and the text is the whole truth, so a snapshot is both simpler and
// impossible to get subtly wrong.
const undos = [], redos = [], UNDO_MAX = 50;

function snapshot() {
  undos.push(doc);
  if (undos.length > UNDO_MAX) undos.shift();
  redos.length = 0;
}

function restore(from, to) {
  if (!from.length) return;
  to.push(doc);
  doc = from.pop();
  const keep = openPaths();            // a reparse must not re-collapse the map
  tree = parse(doc);
  applyOpen(keep);
  sel = null;
  document.getElementById("src").value = doc;
  markDirty();
  paint();
}

// Open/closed state belongs to the view, not the document, so it is carried
// across a reparse by label path rather than by id.
function openPaths(n = tree, trail = [], out = new Set()) {
  if (!n) return out;
  const here = [...trail, n.label].join("\u0001");
  if (n.open) out.add(here);
  n.children.forEach(c => openPaths(c, [...trail, n.label], out));
  return out;
}
function applyOpen(set, n = tree, trail = []) {
  if (!n) return;
  const here = [...trail, n.label].join("\u0001");
  n.open = set.has(here);
  n.children.forEach(c => applyOpen(set, c, [...trail, n.label]));
}

function markDirty() {
  dirty = true;
  const s = document.getElementById("saved");
  s.textContent = "unsaved"; s.style.color = "var(--b2)";
}

function parse(src) {
  const lines = src.split("\n").filter(l => l.trim() && !/^\s*mindmap\s*$/.test(l));
  const root = { label: "root", children: [], depth: -1 };
  const stack = [root];
  for (const raw of lines) {
    const indent = raw.length - raw.trimStart().length;
    let label = raw.trim();
    // mermaid shapes: root((x)) [x] (x) ((x))
    label = label.replace(/<br\s*\/?>/gi, " ");
    const m = label.match(/^[\w-]*\(\((.*)\)\)$/) || label.match(/^[\w-]*\[(.*)\]$/)
           || label.match(/^[\w-]*\((.*)\)$/);
    if (m) label = m[1];
    // A task rides on the label as a trailing tag, so the document stays a
    // single mermaid file that any other renderer still opens.
    //   Ship the thing @todo
    //   Ship the thing @done
    //   Ship the thing @todo(2026-10-24)
    //   Ship the thing @todo(2026-10-24,luciano)
    // A work order rides on the label as a trailing tag, so the document stays
    // a single mermaid file that any other renderer still opens. The fields
    // are the ones the factory needs to start: where the work lands, which
    // ticket it belongs to, and which station it has reached.
    //
    //   Register the namespace @wo(open)
    //   Register the namespace @wo(building,flux,PAY-59)
    //
    //   Register the namespace @wo(a3f91c2b,building,flux,PAY-59)
    //
    // The id comes first and never changes, so renaming the node or moving it
    // does not orphan its description. Everything a label can hold stays in
    // the document, so undo covers it; only the description is too big and
    // lives in orders/<id>.md beside it.
    let task = null;
    const tm = label.match(/\s*@wo\(([^)]*)\)\s*$/i);
    if (tm) {
      label = label.slice(0, tm.index).trim();
      const f = tm[1].split(",").map(x => (x || "").trim());
      // An id is always eight hex characters and a stage name never is, so a
      // tag written before ids existed is still read correctly rather than
      // having its stage mistaken for an identity.
      const hasId = /^[0-9a-f]{8}$/.test(f[0]);
      const [id, st, repo, key] = hasId ? f : [mintId(), ...f];
      task = { id, st: STAGES.includes(st) || st === "stopped" ? st : "open",
               repo: repo || "", key: key || "" };
    }
    const node = { label, children: [], depth: indent, task };
    while (stack.length > 1 && stack[stack.length - 1].depth >= indent) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root.children[0] || { label: "root", children: [], depth: 0 };
}

function serialize(n) {
  const out = ["mindmap"];
  const walk = (node, d) => {
    const pad = "  ".repeat(d + 1);
    const t = node.task;
    const tag = !t ? "" : ` @wo(${[t.id, t.st, t.repo, t.key].join(",").replace(/,+$/, "")})`;
    out.push(pad + (d === 0 ? `root((${node.label}))` : node.label + tag));
    node.children.forEach(c => walk(c, d + 1));
  };
  walk(n, 0);
  return out.join("\n") + "\n";
}

// ---------------------------------------------------------------- layout
// Horizontal tree, children fanned to the right of their parent. Measured
// before placed, so a long label widens its own box rather than overlapping
// the next one.
const PADX = 14, PADY = 9, GAPX = 62, GAPY = 9;

function measure(text, size) {
  const c = measure._c || (measure._c = document.createElement("canvas").getContext("2d"));
  c.font = `${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif`;
  return c.measureText(text).width;
}

// Ids are assigned here, not inside a view's layout, because both views look
// nodes up by id. Numbering them in the map's layout pass meant the outline
// addressed nodes that had never been numbered, and every edit silently
// missed.
// Everything on the selected node's line: the path back to the root so you
// can see where you are, and the subtree so you can see what is under you.
function lineage(id) {
  const keep = new Set();
  (function walk(n, acc) {
    if (n.id === id) {
      acc.forEach(a => keep.add(a.id));
      (function sub(x) { keep.add(x.id); x.children.forEach(sub); })(n);
      return true;
    }
    return n.children.some(c => walk(c, [...acc, n]));
  })(tree, []);
  return keep;
}

function index(root) {
  let i = 0;
  (function walk(n, d) { n.id = i++; n.depth = d; n.children.forEach(c => walk(c, d + 1)); })(root, 0);
  return root;
}

function layout(root) {
  let id = 0;
  const size = n => (n.depth === 0 ? 27 : n.depth === 1 ? 18.5 : n.depth === 2 ? 14 : 12.5);
  const prep = (n, d) => {
    n.fs = size(n);
    n.w = Math.max(n.label ? 0 : 110, measure(n.label, n.fs) + PADX * 2);
    n.h = n.fs + PADY * 2;
    n.kids = n.children.length;
    n.open = n.open !== undefined ? n.open : d < 2;   // start readable, not exhaustive
    n.depth = d;
    (n.open ? n.children : []).forEach(c => prep(c, d + 1));
  };
  prep(root, 0);

  let cursor = 0;
  const shown = n => (n.open ? n.children : []);
  const place = (n) => {
    const kids = shown(n);
    if (!kids.length) { n.y = cursor; cursor += n.h + GAPY + (n.depth <= 1 ? 10 : 0); return; }
    kids.forEach(place);
    n.y = (kids[0].y + kids[kids.length - 1].y) / 2;
  };
  place(root);

  const setX = (n, x) => {
    n.x = x;
    (n.open ? n.children : []).forEach(c => setX(c, x + n.w + GAPX));
  };
  setX(root, 0);
  return root;
}

function flatten(n, out = []) { out.push(n); (n.open ? n.children : []).forEach(c => flatten(c, out)); return out; }

// ---------------------------------------------------------------- render
function branchColor(n, inherited) {
  if (n.depth === 0) return "#8b949e";
  const c = n.depth === 1
    ? getComputedStyle(document.documentElement).getPropertyValue(BRANCH[n.bi % BRANCH.length]).trim()
    : inherited;
  return c;
}

function render() {
  index(tree);
  trailCache = new Map();          // ids are re-assigned on every index pass
  const root = layout(tree);
  root.children.forEach((c, i) => { c.bi = i; });
  const all = flatten(root);
  const lit = sel === null ? null : lineage(sel);
  const on = id => (lit && lit.has(id) ? " lit" : "");
  const colorOf = new Map();
  const assign = (n, c) => {
    const col = n.depth === 0 ? "#6e7681" : (n.depth === 1 ? branchColor(n) : c);
    colorOf.set(n.id, col);
    n.children.forEach(k => assign(k, col));
  };
  assign(root, "#6e7681");

  const minY = Math.min(...all.map(n => n.y));
  const maxY = Math.max(...all.map(n => n.y + n.h));
  // Nodes are not the rightmost thing any more: the station row and the
  // repo hang off them, and a canvas sized to the labels clips both.
  const maxX = Math.max(...all.map(n => n.x + n.w + (n.task ? 230 : 0)));
  const W = maxX + 90, H = (maxY - minY) + 70;

  const svg = document.getElementById("svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const dy = PAD_Y - minY, dx = PAD_X;
  let edges = "", nodes = "", knobs = "";
  for (const n of all) {
    const col = colorOf.get(n.id);

    // Organic connector: leaves the parent at its baseline and arrives at the
    // child's, tapering with depth. Thick near the trunk, fine at the tips,
    // which is what makes a big map readable rather than a net.
    for (const c of (n.open ? n.children : [])) {
      const x1 = n.x + n.w + dx + (n.kids ? 13 : 2), y1 = n.y + n.h / 2 + dy;
      const x2 = c.x + dx + 2,                        y2 = c.y + c.h / 2 + dy;
      const k = Math.max(26, (x2 - x1) * 0.55);
      const wgt = c.depth === 1 ? 3.2 : c.depth === 2 ? 2 : 1.3;
      edges += `<path class="edge${on(c.id)}" d="M ${x1} ${y1} C ${x1 + k} ${y1}, ${x2 - k} ${y2}, ${x2} ${y2}"
        fill="none" stroke="${colorOf.get(c.id)}" stroke-width="${wgt}"
        opacity="${c.depth === 1 ? .95 : .7}" stroke-linecap="round"/>`;
    }

    // Text first. The box only appears on hover or selection, so the map reads
    // as words on branches rather than a wall of rectangles.
    const tx = n.x + dx + n.w / 2, ty = n.y + dy + n.h / 2;
    const weight = n.depth === 0 ? 700 : n.depth === 1 ? 640 : n.depth === 2 ? 480 : 400;
    const fill = n.depth === 0 ? "#f0f6fc" : n.depth === 1 ? col
               : n.depth === 2 ? "#c9d1d9" : "#9aa5b1";
    const isHit = query && n.label.toLowerCase().includes(query);
    const isCur = isHit && hits[hitAt] && hits[hitAt].label === n.label && hits[hitAt].depth === n.depth;
    const j = jobs.get(trailKeyOf(n.id));
    if (j) {
      const run = j.state === "queued" || j.state === "running";
      const c = run ? "#d29922" : j.state === "done" ? "#58a6ff" : "#f85149";
      const ax = n.x + dx - 9, ay = n.y + dy + n.h / 2;
      nodes += `<g class="askmark${run ? " asking" : ""}" data-ask="${n.id}">
        <circle cx="${ax}" cy="${ay}" r="6.5" fill="#0d1117" stroke="${c}" stroke-width="1.3"/>
        <text x="${ax}" y="${ay}" fill="${c}" font-size="8.5" font-weight="700"
              text-anchor="middle" dominant-baseline="central">?</text>
      </g>`;
    }

    const t = n.task;
    const slots = slotsOf(t);
    if (slots) {
      // Five slots, one per station, filled as evidence lands. This is the
      // whole status: no pill, no word, no second place to look.
      const R = 3.6, GAP = 10.5, W = (SLOTS.length - 1) * GAP;
      const cy = n.y + dy + n.h / 2;
      const x0 = n.x + n.w + dx + (n.kids ? 26 : 12);
      let dots = "";
      slots.forEach((st, k) => {
        const cx = x0 + k * GAP, c = SLOT_FILL[st];
        const hollow = st === "empty";
        dots += `<circle cx="${cx}" cy="${cy}" r="${R}"
          fill="${hollow ? "none" : c}" stroke="${c}" stroke-width="${hollow ? 1.2 : 0}"
          ${st === "running" ? 'class="asking"' : ""}/>`;
        // The letters are only for the node you are looking at. Printed on
        // every node they would be a field of grey noise at this size.
        if (sel === n.id) {
          dots += `<text x="${cx}" y="${cy + 11}" fill="${hollow ? "#6e7681" : c}"
            font-size="7" font-weight="700" text-anchor="middle"
            font-family="var(--mono)">${SLOTS[k].k}</text>`;
        }
      });
      nodes += `<g class="chk" data-chk="${n.id}">
        <rect x="${x0 - 8}" y="${cy - 9}" width="${W + 16}" height="18" rx="9"
              fill="#ffffff07"/>${dots}</g>`;
    }

    nodes += `<g class="node${on(n.id)}${sel === n.id ? " sel" : ""}${isHit ? " hit" : ""}${isCur ? " cur" : ""}${t ? " task" : ""}${t && t.st === "shipped" ? " done" : ""}" data-id="${n.id}">
      <rect class="box" x="${n.x + dx + 4}" y="${n.y + dy + 1}" width="${n.w - 8}"
            height="${n.h - 2}" rx="8"/>
      <text x="${tx}" y="${ty}" fill="${fill}" font-size="${n.fs}" font-weight="${weight}"
            text-anchor="middle">${esc(n.label)}</text>
        ${sel === n.id && t && t.repo ? `<text x="${n.x + dx + n.w + (n.kids ? 26 : 12) + (slots ? 58 : 0)}" y="${ty}"
          fill="#6e7681" font-size="10" font-family="var(--mono)">${esc(t.repo)}${
          t.key ? "  \u00b7  " + esc(t.key) : ""}</text>` : ""}
    </g>`;

    // A closed branch says how much it is hiding.
    if (n.kids) {
      const kx = n.x + n.w + dx + 3, ky = n.y + n.h / 2 + dy;
      knobs += `<g class="knob${on(n.id)}" data-knob="${n.id}">
        <circle cx="${kx}" cy="${ky}" r="8" fill="#0d1117"
                stroke="${col}" stroke-width="1.4" opacity="${n.open ? .5 : .85}"/>
        <text x="${kx}" y="${ky}" fill="${col}" font-size="${n.open ? 10 : 9.5}"
              font-weight="600" opacity="${n.open ? .65 : .95}">${n.open ? "\u2212" : n.kids}</text>
      </g>`;
    }
  }
  svg.innerHTML = edges + nodes + knobs;
  // Only dim when dimming actually narrows the view. Selecting the root would
  // otherwise fade nothing while still costing a repaint.
  svg.classList.toggle("focus", lit !== null && lit.size < all.length);
  svg._nodes = new Map(all.map(n => [n.id, n]));
}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---------------------------------------------------------------- editing
// A node's identity across a reparse is its path of labels, since ids are
// assigned fresh each layout.
function path(n, parent) { return n._p || n.label; }

function find(id, n = tree) {
  if (n.id === id) return n;
  for (const c of n.children) { const r = find(id, c); if (r) return r; }
  return null;
}
function parentOf(id, n = tree) {
  for (const c of n.children) { if (c.id === id) return n; const r = parentOf(id, c); if (r) return r; }
  return null;
}

// Editing happens on the node. A prompt for every label is what made adding
// three siblings feel like filling in a form; typing where you are looking is
// what makes it feel like thinking.
let editing = null;   // node id being edited
let editingIsNew = false;

function beginEdit(id, isNew) {
  const n = find(id); if (!n) return;
  editing = id; editingIsNew = !!isNew;
  sel = id; render();

  const box = document.getElementById("svg")._nodes.get(id);
  const el = document.getElementById("edit");
  el.value = n.label;
  el.style.fontSize = box.fs + "px";
  el.style.fontWeight = box.depth === 0 ? 680 : box.depth === 1 ? 620 : 500;
  positionEditor(box);
  el.classList.add("on");
  el.focus(); el.select();
}

function positionEditor(box) {
  const el = document.getElementById("edit");
  const w = Math.max(90, box.w * z);
  el.style.width = w + "px";
  el.style.left = (ox + (box.x + 30) * z + (box.w * z - w) / 2) + "px";
  el.style.top  = (oy + (box.y + 30) * z) + "px";
  el.style.height = (box.h * z) + "px";
}

function commitEdit(keep) {
  const el = document.getElementById("edit");
  if (editing === null) return;
  const n = find(editing);
  const text = el.value.trim();
  el.classList.remove("on");
  const was = editing; editing = null;

  if (!n) return;
  if (!text) {
    // An empty label on a node that was just created means the user changed
    // their mind. Removing it is kinder than leaving a blank box behind.
    if (editingIsNew) { const pp = parentOf(was); if (pp) pp.children.splice(pp.children.indexOf(n), 1); sel = pp ? pp.id : null; }
    editingIsNew = false; touch(); return;
  }
  if (keep === false) { if (editingIsNew) { const pp = parentOf(was); if (pp) pp.children.splice(pp.children.indexOf(n), 1); } editingIsNew = false; touch(); return; }
  // Creating a node and naming it is one action to undo, not two: addNode
  // already took the snapshot.
  if (n.label !== text) { if (!editingIsNew) snapshot(); n.label = text; }
  editingIsNew = false;
  touch();
}

function addNode(where) {
  if (sel === null) return;
  const n = find(sel); if (!n) return;
  snapshot();
  const fresh = { label: "", children: [], open: true };

  if (where === "child") {
    n.open = true;
    n.children.push(fresh);
  } else {
    const pp = parentOf(sel);
    if (!pp) return alert("The root has no sibling.");
    pp.children.splice(pp.children.indexOf(n) + 1, 0, fresh);
  }
  // No serialize here on purpose: an empty label writes a blank line, and the
  // parser drops blank lines, so a round-trip would delete the node we just
  // made. The text is written when the label is committed.
  render();

  // Selection follows the new node and opens it for typing, which is what
  // turns Tab and Enter into an outliner rather than three dialogs.
  const target = flatten(tree).find(x => x.label === "");
  if (target) beginEdit(target.id, true);
}

// Siblings above as well as below, because the order you think of things in
// is rarely the order they belong in.
function addSibling(above) {
  if (sel === null) return;
  const n = find(sel); if (!n) return;
  const pp = parentOf(sel);
  if (!pp) return;
  snapshot();
  const fresh = { label: "", children: [], open: true };
  pp.children.splice(pp.children.indexOf(n) + (above ? 0 : 1), 0, fresh);
  paint();
  const t = allNodes().find(x => x.label === "");
  if (t) view === "map" ? beginEdit(t.id, true) : focusOutline(t.id);
}

// Reordering siblings is the edit you make most while thinking, and dragging
// cannot express "one place up".
function moveSibling(dir) {
  if (sel === null) return;
  const n = find(sel), pp = parentOf(sel);
  if (!n || !pp) return;
  const i = pp.children.indexOf(n), j = i + dir;
  if (j < 0 || j >= pp.children.length) return;
  snapshot();
  pp.children.splice(i, 1);
  pp.children.splice(j, 0, n);
  const keepSel = n.label;
  touch();
  const again = allNodes().find(x => x.label === keepSel);
  if (again) { sel = again.id; paint(); }
}

// Show one level, two, or all. Reaching an overview by clicking every knob is
// the thing that makes a large map tiring.
function showDepth(d) {
  (function walk(n, k) { n.open = d < 0 ? true : k < d; n.children.forEach(c => walk(c, k + 1)); })(tree, 0);
  paint();
  if (view === "map") fit();
}

// Arrow navigation on the map: left goes to the parent, right into the first
// child, up and down between siblings.
function navigate(key) {
  if (sel === null) { sel = tree.id; return paint(); }
  const n = find(sel); if (!n) return;
  const pp = parentOf(sel);
  let to = null;
  if (key === "ArrowLeft")  to = pp;
  if (key === "ArrowRight") { if (n.children.length) { n.open = true; to = n.children[0]; } }
  if ((key === "ArrowUp" || key === "ArrowDown") && pp) {
    const sibs = pp.children, i = sibs.indexOf(n);
    to = sibs[i + (key === "ArrowUp" ? -1 : 1)] || null;
  }
  if (!to) return;
  sel = to.id; paint();
  const b = document.getElementById("svg")._nodes?.get(sel);
  if (b) {
    // Only chase the node when it has left the window, so navigating inside
    // the visible area does not jerk the canvas about.
    const sx = ox + (b.x + 42) * z, sy = oy + (b.y + 30) * z;
    if (sx < 40 || sy < 40 || sx > stage.clientWidth - 60 || sy > stage.clientHeight - 60) {
      ox = stage.clientWidth / 2 - (b.x + 42 + b.w / 2) * z;
      oy = stage.clientHeight / 2 - (b.y + 30 + b.h / 2) * z;
      applyView();
    }
  }
}

function focusOutline(id) {
  const el = document.querySelector(`.lab[data-lab="${id}"]`);
  if (el) { sel = id; el.focus(); placeCaretEnd(el); }
}

function act(a) {
  if (sel === null) return;
  if (a === "child") return addNode("child");
  if (a === "sib") return addNode("sib");
  if (a === "rename") return beginEdit(sel, false);
  if (a === "del") {
    const n = find(sel), pp = parentOf(sel);
    if (!n) return;
    if (!pp) return alert("The root cannot be deleted.");
    const count = flatten(n).length - 1;
    if (count && !confirm(`Delete "${n.label}" and its ${count} descendants?`)) return;
    snapshot();
    pp.children.splice(pp.children.indexOf(n), 1);
    sel = pp.id; touch();
  }
}

function touch() {
  const keep = openPaths();
  doc = serialize(tree);
  tree = parse(doc);
  applyOpen(keep);
  document.getElementById("src").value = doc;
  markDirty();
  paint();
}

// ---------------------------------------------------------------- view
const stage = document.getElementById("stage"), world = document.getElementById("world");
const applyView = () => {
  world.style.transform = `translate(${ox}px,${oy}px) scale(${z})`;
  if (editing !== null) {
    const b = document.getElementById("svg")._nodes?.get(editing);
    if (b) positionEditor(b);
  }
};

function fit() {
  const svg = document.getElementById("svg");
  const w = +svg.getAttribute("width"), h = +svg.getAttribute("height");
  z = Math.min((stage.clientWidth - 60) / w, (stage.clientHeight - 60) / h, 1.6);
  ox = (stage.clientWidth - w * z) / 2; oy = (stage.clientHeight - h * z) / 2;
  applyView();
}

// The toolbar belongs to the selected node and must never sit on top of
// another one. It anchors above, flips below when the node is near the top,
// and stays inside the stage.

// Right-click acts on the node under the cursor, selecting it first, because a
// menu that acts on something other than what you aimed at is a trap.
const MENU = [
  { label: "New child topic",    key: "Tab",   run: () => act("child") },
  { label: "New sibling topic",  key: "Enter", run: () => act("sib") },
  { label: "New sibling above",  key: "\u21e7Enter", run: () => addSibling(true) },
  { label: "Rename",             key: "dbl-click", run: () => act("rename") },
  { sep: true },
  { label: "Advance stage",      key: "Space", run: () => toggleTask(sel) },
  { label: "Open work order",    key: "t",     run: () => editTask(sel) },
  { label: "Emit work order",    key: "w",     run: () => emitWorkOrder(sel) },
  { sep: true },
  { label: "Ask about this",     key: "a",     run: () => openAsk(sel) },
  { sep: true },
  { label: "Move up",            key: "\u2318\u2191", run: () => moveSibling(-1) },
  { label: "Move down",          key: "\u2318\u2193", run: () => moveSibling(1) },
  { label: "Collapse or expand", key: "click the knob", dim: true },
  { sep: true },
  { label: "Delete",             key: "Del",   run: () => act("del") },
];

// A timestamp answers "when" the way a machine would. A person wants to know
// whether what they just typed is safe, which is a relative answer.
let metaN = 0, metaAt = null;
function ago(iso) {
  const t = Date.parse(iso.replace(" ", "T"));
  if (isNaN(t)) return iso;
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 10) return "just now";
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function setMeta(n, at) {
  if (n !== undefined) { metaN = n; metaAt = at; }
  if (!metaAt) return;
  document.getElementById("meta").textContent = `saved ${ago(metaAt)} \u00b7 ${metaN} versions`;
}
setInterval(() => setMeta(), 20000);

function closeMenu() { document.getElementById("menu").classList.remove("on"); }

function openMenu(x, y) {
  const m = document.getElementById("menu");
  m.innerHTML = MENU.map((it, i) => it.sep ? `<div class="sep"></div>` :
    `<div class="mi${it.dim ? " dim" : ""}" data-mi="${i}">
       <span>${it.label}</span><span class="k">${it.key}</span></div>`).join("");
  m.classList.add("on");
  // Flip rather than overflow, so the last item is always reachable.
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, stage.clientWidth - w - 8) + "px";
  m.style.top = Math.min(y, stage.clientHeight - h - 8) + "px";
}

stage.addEventListener("contextmenu", (e) => {
  const g = e.target.closest(".node");
  if (!g) return;                       // the canvas keeps the browser's own menu
  e.preventDefault();
  sel = +g.dataset.id; paint();
  openMenu(e.clientX - stage.getBoundingClientRect().left,
           e.clientY - stage.getBoundingClientRect().top);
});

document.getElementById("menu").addEventListener("click", (e) => {
  const mi = e.target.closest(".mi"); if (!mi) return;
  const it = MENU[+mi.dataset.mi];
  closeMenu();
  if (it && it.run) it.run();
});

addEventListener("pointerdown", (e) => {
  if (!e.target.closest("#menu")) closeMenu();
}, true);
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); closePanel(); closeAsk(); document.getElementById("keys").classList.remove("on"); }
  // "?" is the one shortcut nobody has to be told.
  if (e.key === "?" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) &&
      !document.activeElement.isContentEditable) {
    e.preventDefault();
    document.getElementById("keys").classList.toggle("on");
  }
});
document.getElementById("keys").addEventListener("click", function () { this.classList.remove("on"); });
document.getElementById("hint").addEventListener("click", () =>
  document.getElementById("keys").classList.add("on"));

let lastClickId = null, lastClickAt = 0;
stage.addEventListener("click", (e) => {
  const a = e.target.closest(".askmark");
  if (a) { sel = +a.dataset.ask; paint(); openAsk(sel); return; }
  const c = e.target.closest(".chk");
  if (c) { toggleTask(+c.dataset.chk); return; }
  const k = e.target.closest(".knob");
  if (k) {
    const n = find(+k.dataset.knob);
    if (n) { n.open = !n.open; render(); }
    return;
  }
  const g = e.target.closest(".node");
  const id = g ? +g.dataset.id : null;

  // Second click on the same node within the double-click window opens the
  // editor. Done by id rather than by element, because the first click
  // re-renders and the element the browser would hand us is already gone.
  const now = Date.now();
  if (id !== null && id === lastClickId && now - lastClickAt < 420) {
    lastClickId = null;
    return beginEdit(id, false);
  }
  lastClickId = id; lastClickAt = now;

  if (id === sel) return;          // nothing changed, so nothing to redraw
  sel = id;
  render();
});
document.getElementById("zoom").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.z === "in") z = Math.min(z * 1.2, 4);
  if (b.dataset.z === "out") z = Math.max(z / 1.2, .15);
  if (b.dataset.z === "one") z = 1;
  applyView();
});

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nz = Math.min(Math.max(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), .15), 4);
  ox = mx - (mx - ox) * (nz / z); oy = my - (my - oy) * (nz / z); z = nz; applyView();
}, { passive: false });

let drag = false, px = 0, py = 0;

// Dragging a node onto another reparents it. A node cannot be dropped into
// its own subtree, because that would detach the branch from the tree
// entirely and silently lose it.
let moving = null, overId = null, moved = false, movePtr = null, px0 = 0, py0 = 0;

function descendant(of, id) {
  if (of.id === id) return true;
  return of.children.some(c => descendant(c, id));
}

function nodeAt(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  const g = el && el.closest ? el.closest(".node") : null;
  return g ? +g.dataset.id : null;
}

stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".knob") || e.target.closest(".chk") || e.target.closest(".askmark")) return;
  if (!(e.target === stage || e.target.closest("#svg"))) return;
  const g = e.target.closest(".node");
  if (g) {
    const id = +g.dataset.id;
    if (parentOf(id)) { moving = id; moved = false; movePtr = e.pointerId; px0 = e.clientX; py0 = e.clientY; }
    return;
  }
  drag = true; px = e.clientX; py = e.clientY; stage.classList.add("drag");
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener("pointermove", (e) => {
  if (moving !== null) {
    if (!moved) {
      // A press is not a drag until it travels. Capturing earlier swallowed
      // the click, which is how selection broke.
      if (Math.abs(e.clientX - px0) < 4 && Math.abs(e.clientY - py0) < 4) return;
      moved = true;
      try { stage.setPointerCapture(movePtr); } catch (_) {}
    }
    const over = nodeAt(e.clientX, e.clientY);
    const src = find(moving);
    const ok = over !== null && over !== moving && src && !descendant(src, over);
    if (over !== overId) {
      document.querySelectorAll(".node.drop").forEach(n => n.classList.remove("drop"));
      overId = ok ? over : null;
      if (overId !== null) document.querySelector(`.node[data-id="${overId}"]`)?.classList.add("drop");
    }
    document.querySelector(`.node[data-id="${moving}"]`)?.classList.add("ghost");
    const tip = document.getElementById("dropline");
    const target = overId !== null ? find(overId) : null;
    tip.textContent = target ? `move into ${target.label}` : "drop on a node to reparent";
    tip.style.left = (e.clientX - stage.getBoundingClientRect().left + 14) + "px";
    tip.style.top  = (e.clientY - stage.getBoundingClientRect().top + 14) + "px";
    tip.classList.add("on");
    return;
  }
  if (!drag) return; ox += e.clientX - px; oy += e.clientY - py;
  px = e.clientX; py = e.clientY; applyView();
});

function endMove() {
  const tip = document.getElementById("dropline");
  tip.classList.remove("on");
  document.querySelectorAll(".node.drop,.node.ghost").forEach(n => n.classList.remove("drop", "ghost"));
  if (moving !== null && overId !== null && moved) {
    const src = find(moving), from = parentOf(moving), to = find(overId);
    if (src && from && to && !descendant(src, overId)) {
      snapshot();
      from.children.splice(from.children.indexOf(src), 1);
      to.open = true;
      to.children.push(src);
      sel = null; touch();
    }
  }
  moving = null; overId = null; moved = false; movePtr = null;
}

const stop = (e) => { drag = false; stage.classList.remove("drag"); endMove(); };
stage.addEventListener("pointerup", stop); stage.addEventListener("pointercancel", stop);

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); return save(); }
  if (mod && e.key.toLowerCase() === "f") { e.preventDefault(); return document.getElementById("find").select(); }
  if (e.key === "F3") { e.preventDefault(); return stepHit(e.shiftKey ? -1 : 1); }
  if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); return restore(undos, redos); }
  if (mod && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) {
    e.preventDefault(); return restore(redos, undos);
  }
  // Zoom and depth work with nothing selected, so they come first.
  if (e.key === "0") { e.preventDefault(); z = 1; ox = 0; oy = 0; return applyView(); }
  if (e.key === "F6") { e.preventDefault(); return fit(); }
  if (mod && e.shiftKey && e.key.toLowerCase() === "h") { e.preventDefault(); return fit(); }
  if (e.altKey && "1290".includes(e.key)) {
    e.preventDefault();
    return showDepth(e.key === "0" || e.key === "9" ? -1 : +e.key);
  }
  if (!mod && !e.altKey && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
    e.preventDefault(); return navigate(e.key);
  }
  if (mod && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault(); return moveSibling(e.key === "ArrowUp" ? -1 : 1);
  }

  if (sel === null) return;
  if (e.key === "Tab") { e.preventDefault(); act("child"); }
  if (e.key === "Enter") { e.preventDefault(); e.shiftKey ? addSibling(true) : act("sib"); }
  if (mod && e.key === "Enter") { e.preventDefault(); act("rename"); }
  if (e.key === "F2") { e.preventDefault(); act("rename"); }
  if (e.key === " ") { e.preventDefault(); toggleTask(sel); }
  if (e.key.toLowerCase() === "t") { e.preventDefault(); editTask(sel); }
  if (e.key.toLowerCase() === "w") { e.preventDefault(); emitWorkOrder(sel); }
  if (e.key.toLowerCase() === "a") { e.preventDefault(); openAsk(sel); }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); act("del"); }
});

// ---------------------------------------------------------------- outline
// The same tree, read as a list. Nothing here owns state: it renders from the
// tree and edits it through the same functions the map uses, so the two views
// can never drift apart.
let view = "map";

function colorFor(n, root) {
  if (n.depth === 0) return "#6e7681";
  let t = n, trail = [];
  // walk up to the depth-1 ancestor, which is what carries the branch colour
  const findTrail = (cur, want, acc) => {
    if (cur === want) { trail = acc; return true; }
    return cur.children.some(c => findTrail(c, want, [...acc, cur]));
  };
  findTrail(root, n, []);
  const top = trail.length > 1 ? trail[1] : n;
  const i = root.children.indexOf(top);
  const v = getComputedStyle(document.documentElement).getPropertyValue(BRANCH[(i < 0 ? 0 : i) % BRANCH.length]);
  return v.trim();
}

function renderOutline() {
  index(tree);
  const body = document.getElementById("olBody");
  const root = tree;
  let html = "";

  const row = (n, depth, col) => {
    const kids = n.children.length;
    const open = n.open !== false;
    const isHit = query && n.label.toLowerCase().includes(query);
    html += `<div class="r d${Math.min(depth,3)}${sel === n.id ? " sel" : ""}${isHit ? " hit" : ""}${n.task && n.task.st === "shipped" ? " done" : ""}"
                  data-id="${n.id}" style="margin-left:${depth * 26}px">
      <span class="chev${kids ? " has" : ""}" data-chev="${n.id}">${kids ? (open ? "\u25be" : "\u25b8") : ""}</span>
      ${n.task ? `<span class="slots" data-chk="${n.id}">${
          slotsOf(n.task).map((st, k) =>
            `<i class="s ${st}" title="${SLOTS[k].name}"></i>`).join("")}</span>` : ""}
      ${depth ? `<span class="dot" style="background:${col}"></span>` : ""}
      <span class="lab" contenteditable="true" spellcheck="false"
            data-lab="${n.id}" style="${depth === 1 ? `color:${col}` : ""}">${esc(n.label)}</span>
      ${n.task ? taskMeta(n.task) : ""}
      ${kids && !open ? `<span class="n">${kids}</span>` : ""}
    </div>`;
    if (open) n.children.forEach(c => row(c, depth + 1, depth === 0 ? colorFor(c, root) : col));
  };
  row(root, 0, "#6e7681");
  body.innerHTML = html;
}

// Overdue is worth seeing without opening anything, so it is coloured in the
// row rather than hidden behind a click.
function taskMeta(t) {
  const bits = [t.repo, t.key].filter(Boolean);
  return bits.length ? `<span class="meta">${bits.join(" \u00b7 ")}</span>` : "";
}

// Space promotes a node to work and then advances it through the line. The
// stations are the real ones, so the map answers "where is this" rather than
// "is this done".
function toggleTask(id) {
  const n = find(id); if (!n) return;
  snapshot();
  if (!n.task) n.task = { id: mintId(), st: "open", repo: "", key: "" };
  else {
    const i = STAGES.indexOf(n.task.st);
    if (i >= STAGES.length - 1) n.task = null;      // past shipped is an ordinary node again
    else n.task.st = STAGES[i + 1];
  }
  touch();
}

// The description is the whole point: without it a brief is a form with every
// field marked unknown. It is too long for a label, so it lives in
// orders/<id>.md keyed by the work order's own id.
const panel = document.getElementById("panel");
let panelFor = null, descLoaded = "";

let trailCache = new Map();
function trailKeyOf(id) {
  if (!trailCache.has(id)) trailCache.set(id, pathKey(trailTo(id)));
  return trailCache.get(id);
}

function trailTo(id) {
  const out = [];
  (function walk(x, acc) {
    if (x.id === id) { out.push(...acc.map(a => a.label), x.label); return true; }
    return x.children.some(c => walk(c, [...acc, x]));
  })(tree, []);
  return out;
}

async function editTask(id) {
  const n = find(id); if (!n) return;
  if (!n.task) { snapshot(); n.task = { id: mintId(), st: "open", repo: "", key: "" }; touch(); }
  panelFor = id;

  const t = find(id).task;
  panel.querySelector(".pid").textContent = t.id;
  panel.querySelector(".trail").textContent = trailTo(id).slice(0, -1).join("  /  ") || "root";
  panel.querySelector(".ttl").textContent = n.label || "untitled";
  panel.querySelector(".repo").value = t.repo;
  panel.querySelector(".key").value = t.key;
  panel.querySelector(".stage").innerHTML =
    [...STAGES, "stopped"].map(x => `<option${x === t.st ? " selected" : ""}>${x}</option>`).join("");
  panel.querySelector(".note").textContent = "";

  const ta = panel.querySelector(".desc");
  ta.value = "";
  panel.classList.add("on");
  placePanel(id);

  // Fetched rather than cached, so a second window never shows a stale
  // description it happened to be holding.
  const r = await fetch("/api/order/" + t.id).then(x => x.json()).catch(() => null);
  if (panelFor !== id) return;              // the user moved on while we waited
  descLoaded = (r && r.description) || "";
  ta.value = descLoaded;
  ta.focus();
}

function placePanel(id) { placeNear(panel, id); }

function closePanel() { panel.classList.remove("on"); panelFor = null; }

// ---------------------------------------------------------------- asking ---
//
// A question is a job ABOUT a node, not part of the document. Keeping it out
// of the mermaid text means undo stays about the map, the file stays readable,
// and an answer is never lost to an unrelated edit.
//
// Jobs are keyed by the node's path from the root, which is exactly what the
// server hashes into the job id. Rename a node and its old answers stop
// following it, which is honest: the question was asked about something else.

const askBox = document.getElementById("ask");
const jobs = new Map();                   // pathKey -> newest job for that node
let askFor = null;

const pathKey = labels => labels.join("\u0000");

function noteJob(j) {
  if (!j || !j.path) return;
  jobs.set(pathKey(j.path), j);
}

// The page may have been closed while a question was running, so the current
// state comes from the server rather than from whatever this tab remembers.
async function loadJobs() {
  const all = await fetch("/api/ask").then(r => r.json()).catch(() => []);
  // Oldest first so the newest ends up winning for each node.
  for (let i = all.length - 1; i >= 0; i--) noteJob(all[i]);
  paint();
}

function openAsk(id) {
  const n = find(id); if (!n) return;
  askFor = id;
  const trail = trailTo(id);
  const j = jobs.get(pathKey(trail));

  askBox.querySelector(".trail").textContent = trail.slice(0, -1).join("  /  ") || "root";
  askBox.querySelector(".ttl").textContent = n.label || "untitled";
  askBox.querySelector(".st").textContent = j ? j.state : "not asked";
  askBox.querySelector(".note").textContent = "";

  const q = askBox.querySelector(".q"), out = askBox.querySelector(".out");
  q.value = j ? j.prompt : "";
  out.textContent = (j && j.answer) || (j && j.err) || "";
  out.classList.toggle("on", !!out.textContent);

  askBox.classList.add("on");
  placeNear(askBox, id);
  q.focus();
  q.setSelectionRange(q.value.length, q.value.length);
}

function closeAsk() { askBox.classList.remove("on"); askFor = null; }

async function send() {
  if (askFor === null) return;
  const q = askBox.querySelector(".q").value.trim();
  if (!q) return;
  const trail = trailTo(askFor);
  const out = askBox.querySelector(".out");
  out.textContent = ""; out.classList.add("on");
  askBox.querySelector(".note").textContent = "";

  const r = await fetch("/api/ask", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ node: find(askFor).label, prompt: q, path: trail }),
  }).then(x => x.json()).catch(() => null);

  if (!r || r.error) {
    askBox.querySelector(".note").textContent = (r && r.error) || "could not reach the server";
    return;
  }
  noteJob(r);
  askBox.querySelector(".st").textContent = r.state;
  // An answer that already exists comes straight back rather than being
  // asked for a second time.
  if (r.answer) out.textContent = r.answer;
  paint();
}

askBox.querySelector(".px").addEventListener("click", closeAsk);
askBox.querySelector("[data-k=send]").addEventListener("click", send);
askBox.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); closeAsk(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); }
});

// One stream for the whole page. EventSource reconnects by itself, so a
// server restart heals without anyone reloading.
function listen() {
  const es = new EventSource("/api/events");
  es.addEventListener("job", (ev) => {
    const j = JSON.parse(ev.data);
    noteJob(j);
    if (askFor !== null && pathKey(trailTo(askFor)) === pathKey(j.path || [])) {
      askBox.querySelector(".st").textContent = j.state;
      if (j.answer || j.err) {
        const out = askBox.querySelector(".out");
        out.textContent = j.answer || j.err;
        out.classList.add("on");
      }
    }
    paint();
  });
  es.addEventListener("token", (ev) => {
    const t = JSON.parse(ev.data);
    if (askFor === null) return;
    const j = jobs.get(pathKey(trailTo(askFor)));
    if (!j || j.id !== t.id) return;      // tokens for a node you are not looking at
    const out = askBox.querySelector(".out");
    out.classList.add("on");
    out.textContent += t.text;
    out.scrollTop = out.scrollHeight;
  });
}

// Both small panels sit beside their node, preferring the right.
function placeNear(el, id) {
  const n = document.getElementById("svg")._nodes?.get(id);
  if (!n) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  const right = ox + (n.x + PAD_X + n.w) * z + 14;
  const left = ox + (n.x + PAD_X) * z - w - 14;
  const x = right + w <= stage.clientWidth - 8 ? right
          : left >= 8 ? left : Math.max(8, stage.clientWidth - w - 8);
  const y = Math.max(8, Math.min(oy + (n.y + PAD_Y) * z - 10, stage.clientHeight - h - 8));
  el.style.left = x + "px"; el.style.top = y + "px";
}

async function savePanel() {
  if (panelFor === null) return null;
  const n = find(panelFor); if (!n || !n.task) return null;
  const repo = panel.querySelector(".repo").value.trim();
  const key = panel.querySelector(".key").value.trim();
  const st = panel.querySelector(".stage").value;
  const desc = panel.querySelector(".desc").value;

  if (repo !== n.task.repo || key !== n.task.key || st !== n.task.st) {
    snapshot();
    n.task.repo = repo; n.task.key = key; n.task.st = st;
    touch();
  }
  if (desc !== descLoaded) {
    await fetch("/api/order/" + n.task.id, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ description: desc, label: n.label, path: trailTo(panelFor) }),
    }).catch(() => null);
    descLoaded = desc;
  }
  return n;
}

panel.querySelector(".px").addEventListener("click", closePanel);
panel.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  const note = panel.querySelector(".note");
  const n = await savePanel();
  if (!n) return;
  if (b.dataset.p === "save") {
    note.textContent = "saved";
    setTimeout(() => { note.textContent = ""; }, 1600);
    return;
  }
  const id = panelFor;
  closePanel();
  emitWorkOrder(id);
});
panel.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); closePanel(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); savePanel(); closePanel(); }
});

// Emitting a work order is the handover from thinking to doing: it writes a
// brief stub into the same directory the factory already reads, and records
// the order in its own append-only log.
async function emitWorkOrder(id) {
  const n = find(id);
  if (!n || !n.task) return alert("Press space on a node first to make it work.");
  if (!n.task.repo) {
    alert("A work order needs a repo before it can be started.\nPress t to set one.");
    return editTask(id);
  }

  // The path from the root is the context a brief needs and a label alone
  // never carries: "Post" means nothing, "Services / payment-worker / Post"
  // does.
  const trail = [];
  (function walk(x, acc) {
    if (x.id === id) { trail.push(...acc, x); return true; }
    return x.children.some(c => walk(c, [...acc, x]));
  })(tree, []);

  const r = await fetch("/api/workorder", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id: n.task.id, label: n.label, repo: n.task.repo, key: n.task.key || "",
      stage: n.task.st, path: trail.map(x => x.label),
    }),
  }).then(x => x.json()).catch(() => null);

  if (!r || r.error) return alert("Could not write the work order: " + (r && r.error || "no reply"));
  if (n.task.st === "open") { snapshot(); n.task.st = "briefed"; touch(); }
  alert(`Work order ${r.id} written.\n\n${r.brief}\n\nFill the brief, then run station 1 against it.`);
}

function paint() { view === "map" ? render() : renderOutline(); }

function setView(v) {
  if (view === v) return;
  view = v;
  document.getElementById("stage").classList.toggle("off", v !== "map");
  document.getElementById("outline").classList.toggle("on", v === "outline");
  document.getElementById("bview").textContent = v === "map" ? "outline" : "map";
  paint();
  if (v === "map") fit();
}

// ---------------------------------------------------------------- find
// Search has to open what it finds. With the map collapsed by default a match
// three levels down would otherwise be reported and still invisible.
let hits = [], hitAt = -1, query = "";

function runFind(q) {
  query = q.trim().toLowerCase();
  hits = []; hitAt = -1;
  if (!query) { paint(); document.getElementById("findN").textContent = ""; return; }

  const match = [];
  (function walk(n, trail) {
    const me = [...trail, n];
    if (n.label.toLowerCase().includes(query)) match.push(me);
    n.children.forEach(c => walk(c, me));
  })(tree, []);

  // Open every ancestor of every match, so the result is on screen rather
  // than merely counted.
  match.forEach(trail => trail.slice(0, -1).forEach(a => { a.open = true; }));
  paint();

  const byId = new Map(flatten(tree).map(n => [n.label + "\u0001" + n.depth, n]));
  hits = match.map(t => t[t.length - 1]).filter(n => byId.has(n.label + "\u0001" + n.depth));
  document.getElementById("findN").textContent = hits.length ? `1/${hits.length}` : "none";
  if (hits.length) { hitAt = 0; focusHit(); }
}

function focusHit() {
  const n = hits[hitAt]; if (!n) return;
  sel = n.id; render();
  document.getElementById("findN").textContent = `${hitAt + 1}/${hits.length}`;
  const b = document.getElementById("svg")._nodes.get(n.id);
  if (!b) return;
  // Centre it rather than scroll it barely into view.
  ox = stage.clientWidth / 2 - (b.x + 30 + b.w / 2) * z;
  oy = stage.clientHeight / 2 - (b.y + 30 + b.h / 2) * z;
  applyView();
}

function stepHit(d) {
  if (!hits.length) return;
  hitAt = (hitAt + d + hits.length) % hits.length;
  focusHit();
}

// ---------------------------------------------------------------- export
function exportSVG() {
  const svg = document.getElementById("svg").cloneNode(true);
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  // The page's CSS is not carried by a detached SVG, so the few rules that
  // matter are inlined. Without this an exported file loses its typography.
  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  style.textContent = `text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .box{fill:transparent;stroke:transparent}`;
  svg.insertBefore(style, svg.firstChild);
  const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%"); bg.setAttribute("fill", "#0d1117");
  svg.insertBefore(bg, style.nextSibling);
  return new XMLSerializer().serializeToString(svg);
}

// Markdown, because a map that cannot be pasted into a ticket or a doc stays
// on one machine. A task becomes a checkbox, which is what it already is.
function asMarkdown() {
  const out = [`# ${tree.label}`, ""];
  (function walk(n, d) {
    n.children.forEach(c => {
      const t = c.task;
      const box = t ? (t.done ? "[x] " : "[ ] ") : "";
      const meta = t && (t.due || t.who) ? `  _(${[t.due, t.who].filter(Boolean).join(", ")})_` : "";
      out.push("  ".repeat(d) + `- ${box}${c.label}${meta}`);
      walk(c, d + 1);
    });
  })(tree, 0);
  return out.join("\n") + "\n";
}

function download(name, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}

async function exportAs(kind) {
  const src = exportSVG();
  if (kind === "svg") return download("mindmap.svg", new Blob([src], { type: "image/svg+xml" }));
  if (kind === "mmd") return download("mindmap.mmd", new Blob([doc], { type: "text/plain" }));
  if (kind === "md")  return download("mindmap.md",  new Blob([asMarkdown()], { type: "text/markdown" }));

  const svg = document.getElementById("svg");
  const w = +svg.getAttribute("width"), h = +svg.getAttribute("height"), scale = 2;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([src], { type: "image/svg+xml;charset=utf-8" }));
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement("canvas");
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext("2d");
  g.fillStyle = "#0d1117"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  c.toBlob(b => download("mindmap.png", b), "image/png");
}

// ---------------------------------------------------------------- io
async function load() {
  const r = await fetch("/api/doc").then(x => x.json());
  doc = r.src; tree = parse(doc);
  document.getElementById("src").value = doc;
  if (r.at) setMeta(r.n, r.at);
  else document.getElementById("meta").textContent = "new document";
  render(); fit();
}

async function save() {
  const srcBox = document.getElementById("src");
  if (document.activeElement === srcBox) { doc = srcBox.value; tree = parse(doc); render(); }
  const r = await fetch("/api/doc", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ src: doc, note: "" }),
  }).then(x => x.json()).catch(() => null);
  if (!r) return;
  dirty = false;
  const s = document.getElementById("saved");
  s.textContent = "saved"; s.style.color = "var(--b1)";
  setMeta(r.n, r.at);
  setTimeout(() => { if (!dirty) s.textContent = ""; }, 2200);
}

document.getElementById("bsave").onclick = save;
document.getElementById("bview").onclick = () => setView(view === "map" ? "outline" : "map");

// --- outline interaction -------------------------------------------------
const ol = document.getElementById("outline");

ol.addEventListener("click", (e) => {
  const k2 = e.target.closest(".chk2");
  if (k2) { e.preventDefault(); toggleTask(+k2.dataset.chk); return; }
  const c = e.target.closest(".chev.has");
  if (c) { const n = find(+c.dataset.chev); if (n) { n.open = n.open === false; renderOutline(); } return; }
  // Clicking the label must not redraw: re-rendering replaces the element the
  // caret just landed in, so the first keystroke went nowhere. Selection is
  // painted by a class, which is cheap enough to do without a redraw.
  const lab = e.target.closest(".lab");
  const r = e.target.closest(".r");
  if (!r) return;
  sel = +r.dataset.id;
  ol.querySelectorAll(".r.sel").forEach(x => x.classList.remove("sel"));
  r.classList.add("sel");
  if (!lab) { const l = r.querySelector(".lab"); if (l) { l.focus(); placeCaretEnd(l); } }
});

// Editing is the label itself. No dialog, no separate field: the thing you
// are reading is the thing you type into.
ol.addEventListener("focusin", (e) => {
  const l = e.target.closest(".lab");
  if (l) { sel = +l.dataset.lab; l.dataset.was = l.textContent; }
});

ol.addEventListener("blur", (e) => {
  const l = e.target.closest(".lab");
  if (!l) return;
  const n = find(+l.dataset.lab); if (!n) return;
  const text = l.textContent.replace(/\s+/g, " ").trim();
  if (text === n.label) return;
  if (!text) { l.textContent = n.label; return; }   // a blank label would vanish on save
  snapshot(); n.label = text; touch();
}, true);

ol.addEventListener("keydown", (e) => {
  const l = e.target.closest(".lab");
  if (!l) return;
  const id = +l.dataset.lab;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); l.blur(); return save(); }
  if (mod && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault(); l.blur(); sel = id;
    moveSibling(e.key === "ArrowUp" ? -1 : 1);
    return focusOutline(sel);
  }
  if (mod) return;                       // undo and friends belong to the document

  if (e.key === "Enter")  {
    e.preventDefault(); l.blur(); sel = id;
    e.shiftKey ? addSibling(true) : addOutlineNode("sib");
  }
  if (e.key === "Tab")    { e.preventDefault(); l.blur(); sel = id; addOutlineNode("child"); }
  if (e.key === "Escape") { e.preventDefault(); l.textContent = l.dataset.was || ""; l.blur(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const labs = [...ol.querySelectorAll(".lab")];
    const i = labs.indexOf(l) + (e.key === "ArrowDown" ? 1 : -1);
    if (labs[i]) { labs[i].focus(); placeCaretEnd(labs[i]); }
  }
  if ((e.key === "Backspace" || e.key === "Delete") && !l.textContent.trim()) {
    e.preventDefault();
    const n = find(id), pp = parentOf(id);
    if (pp && !n.children.length) { snapshot(); pp.children.splice(pp.children.indexOf(n), 1); sel = pp.id; touch(); }
  }
});

function placeCaretEnd(el) {
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function allNodes(n = tree, out = []) { out.push(n); n.children.forEach(c => allNodes(c, out)); return out; }

function addOutlineNode(where) {
  if (sel === null) return;
  const n = find(sel); if (!n) return;
  snapshot();
  const fresh = { label: "", children: [], open: true };
  if (where === "child") { n.open = true; n.children.push(fresh); }
  else {
    const pp = parentOf(sel);
    if (!pp) { n.children.push(fresh); }   // the root has no sibling; a child is the useful thing
    else pp.children.splice(pp.children.indexOf(n) + 1, 0, fresh);
  }
  renderOutline();
  const el = [...ol.querySelectorAll(".lab")].find(x => !x.textContent.trim());
  if (el) { sel = +el.dataset.lab; el.focus(); }
}

let findTimer = null;
const findBox = document.getElementById("find");
findBox.addEventListener("input", (e) => {
  clearTimeout(findTimer);
  findTimer = setTimeout(() => runFind(e.target.value), 120);
});
findBox.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter") { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); }
  if (e.key === "Escape") { e.preventDefault(); findBox.value = ""; runFind(""); findBox.blur(); }
});

document.getElementById("bexport").onclick = () => {
  const k = prompt("Export as: png, svg, md, or mmd", "png");
  if (k && ["png", "svg", "md", "mmd"].includes(k.trim().toLowerCase())) exportAs(k.trim().toLowerCase());
};
document.getElementById("bfit").onclick = fit;
document.getElementById("bclose").onclick = () => document.getElementById("side").classList.remove("open");
document.getElementById("bsrc").onclick = () => {
  const a = document.getElementById("side");
  document.getElementById("src").style.display = ""; document.getElementById("hist").style.display = "none";
  document.getElementById("sideTitle").textContent = "mermaid source";
  a.classList.toggle("open");
};
document.getElementById("bhist").onclick = async () => {
  const a = document.getElementById("side");
  const h = await fetch("/api/history").then(x => x.json());
  document.getElementById("hist").innerHTML = h.map(e =>
    `<div><b>${e.at}</b> &middot; ${e.lines} lines${e.note ? " &middot; " + esc(e.note) : ""}</div>`).join("")
    || "<div>nothing saved yet</div>";
  document.getElementById("src").style.display = "none"; document.getElementById("hist").style.display = "";
  document.getElementById("sideTitle").textContent = "history · append only";
  a.classList.add("open");
};
let srcTimer = null;
document.getElementById("src").addEventListener("input", (e) => {
  // One snapshot per burst of typing, so undo steps through edits rather than
  // through keystrokes.
  clearTimeout(srcTimer);
  if (!srcTimer) snapshot();
  srcTimer = setTimeout(() => { srcTimer = null; }, 700);
  try {
    const keep = openPaths();
    tree = parse(e.target.value); doc = e.target.value;
    applyOpen(keep);
    markDirty(); render();
  } catch (_) { /* half-typed text is not an error */ }
});

const ed = document.getElementById("edit");
ed.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter")  { e.preventDefault(); commitEdit(true); }
  if (e.key === "Escape") { e.preventDefault(); commitEdit(false); }
  if (e.key === "Tab")    { e.preventDefault(); commitEdit(true); act("child"); }
});
ed.addEventListener("blur", () => { if (editing !== null) commitEdit(true); });

window.addEventListener("resize", () => { if (panelFor !== null) placeNear(panel, panelFor);
                                          if (askFor !== null) placeNear(askBox, askFor); });
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
load().then(loadJobs);
listen();
</script>
